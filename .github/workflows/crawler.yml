name: Gold Price & News Crawler

on:
  schedule:
    # Price crawler: Every 30 minutes from 00:00-12:00 UTC (7:00 AM - 7:00 PM UTC+7)
    # UTC+7 = Vietnam time, so we need to subtract 7 hours
    # 7:00 AM UTC+7 = 00:00 UTC
    # 7:00 PM UTC+7 = 12:00 UTC
    - cron: '0,30 0-11 * * *'   # Every 30 min from 00:00-11:30 UTC
    - cron: '0 12 * * *'         # Final run at 12:00 UTC (7:00 PM UTC+7)

    # News crawler: Every 2 hours (24/7)
    - cron: '0 */2 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      crawler_type:
        description: 'Crawler to run'
        required: true
        default: 'prices'
        type: choice
        options:
          - prices
          - news
          - both

jobs:
  crawl-prices:
    runs-on: ubuntu-latest
    # Run on schedule or manual trigger for prices
    if: |
      (github.event.schedule == '0,30 0-11 * * *') ||
      (github.event.schedule == '0 12 * * *') ||
      (github.event.inputs.crawler_type == 'prices') ||
      (github.event.inputs.crawler_type == 'both')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Price Crawler
        run: npm run crawl:prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          TZ: Asia/Ho_Chi_Minh
        timeout-minutes: 10

      - name: Upload logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: price-crawler-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7

  crawl-news:
    runs-on: ubuntu-latest
    # Run on schedule or manual trigger for news
    if: |
      (github.event.schedule == '0 */2 * * *') ||
      (github.event.inputs.crawler_type == 'news') ||
      (github.event.inputs.crawler_type == 'both')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run News Crawler
        run: npm run crawl:news
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          TZ: Asia/Ho_Chi_Minh
        timeout-minutes: 15

      - name: Upload logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: news-crawler-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
