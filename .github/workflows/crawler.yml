name: Gold Price & News Crawler (Optimized with Archive)

on:
  schedule:
    # Price crawler: Every 30 minutes from 00:00-12:00 UTC (7:00 AM - 7:00 PM UTC+7)
    - cron: '0,30 0-11 * * *'
    - cron: '0 12 * * *'

    # News crawler: Every 2 hours (24/7)
    - cron: '0 */2 * * *'

    # Archive prices: End of day at 17:00 UTC (12:00 AM midnight UTC+7)
    - cron: '0 17 * * *'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      crawler_type:
        description: 'Crawler to run'
        required: true
        default: 'prices'
        type: choice
        options:
          - prices
          - news
          - archive
          - both

jobs:
  crawl-prices:
    runs-on: ubuntu-latest
    if: |
      (github.event.schedule == '0,30 0-11 * * *') ||
      (github.event.schedule == '0 12 * * *') ||
      (github.event.inputs.crawler_type == 'prices') ||
      (github.event.inputs.crawler_type == 'both')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Cache Playwright browsers
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # Cache Prisma engines
      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            ~/.cache/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            prisma-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Run Price Crawler
        run: npm run crawl:prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          TZ: Asia/Ho_Chi_Minh
        timeout-minutes: 10

      - name: Upload logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: price-crawler-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7

  crawl-news:
    runs-on: ubuntu-latest
    if: |
      (github.event.schedule == '0 */2 * * *') ||
      (github.event.inputs.crawler_type == 'news') ||
      (github.event.inputs.crawler_type == 'both')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            ~/.cache/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            prisma-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run News Crawler
        run: npm run crawl:news
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          TZ: Asia/Ho_Chi_Minh
        timeout-minutes: 15

      - name: Upload logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: news-crawler-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7

  archive-prices:
    runs-on: ubuntu-latest
    # Run at end of day (17:00 UTC = midnight Vietnam) or manual trigger
    if: |
      (github.event.schedule == '0 17 * * *') ||
      (github.event.inputs.crawler_type == 'archive')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            ~/.cache/prisma
          key: prisma-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            prisma-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Archive End-of-Day Prices
        run: npm run archive:once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          TZ: Asia/Ho_Chi_Minh
        timeout-minutes: 5

      - name: Re-run daily price once
        run: npm run crawl:prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          TZ: Asia/Ho_Chi_Minh
        timeout-minutes: 5

      - name: Upload logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
